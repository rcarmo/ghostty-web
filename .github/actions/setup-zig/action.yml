name: 'Setup Zig'
description: 'Install the pinned Zig toolchain in the project cache'
inputs:
  version:
    description: 'Zig version to install'
    required: true
    default: '0.17.0'
runs:
  using: 'composite'
  steps:
    - name: Resolve project cache
      id: paths
      shell: bash
      run: |
        root=$("$GITHUB_ACTION_PATH/../../../scripts/project-tmp.sh" init)
        echo "root=$root" >> "$GITHUB_OUTPUT"

    - name: Cache Zig
      uses: actions/cache@v5
      with:
        path: ${{ steps.paths.outputs.root }}/cache/zig/toolchains/${{ inputs.version }}
        key: zig-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Install Zig
      shell: bash
      env:
        PROJECT_TMP_ROOT: ${{ steps.paths.outputs.root }}
        ZIG_VERSION: ${{ inputs.version }}
      run: |
        bin_dir=$("$GITHUB_ACTION_PATH/../../../scripts/ensure-zig.sh" "$ZIG_VERSION")
        echo "$bin_dir" >> "$GITHUB_PATH"
        "$bin_dir/zig" version
